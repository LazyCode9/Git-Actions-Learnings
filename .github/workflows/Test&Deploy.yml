name: Lint-Test-Deploy
on: push
jobs:
  Checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
  Lint:
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Perform Lint
        run: |
          npm run lint
          echo "Lint Successful"

  Test:
    runs-on: ubuntu-latest
    needs: Lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Perform Test
        run: |
          npm run test
          echo "Test Successful"

  Build:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Perforn Deployment
        run: |
          npm run build
          echo "Deployment Successful"
